[package]
name = "zlalalaz"
version = "1.0.0"
description = "ZLaLaLaZ - Aplicación de Escritorio y Móvil de Punto de Venta (POS) en Rust con Tauri v2"
authors = ["Deus Ex Umbra"]
edition = "2021"

[lib]
name = "zlalalaz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
